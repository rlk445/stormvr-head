name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project StormVRHead.xcodeproj -scheme StormVRHead \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/StormVRHead.app Payload/
          zip -r StormVRHead.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StormVRHead-ipa
          path: StormVRHead.ipa
